name: Fighting game deal check

on:
  schedule:
    # Every 6 hours. Cron is UTC. Adjust as you like.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit state.json back

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate deal data and results page
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}     # optional, defaults to https://ntfy.sh
          MIN_DISCOUNT: ${{ secrets.MIN_DISCOUNT }}   # optional, defaults to 60
          PAGES_URL: ${{ secrets.PAGES_URL }}         # optional, auto-detected from repo if unset
        run: python fighting_deals.py --generate-only

      - name: Save updated state and results page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- state.json docs/
          if ! git diff --cached --quiet; then
            git commit -m "Update deal state and results page"
            git push
          fi

      - name: Wait for GitHub Pages to redeploy
        # A blind wait rather than polling the Pages API - simple and reliable
        # enough for this project. Only matters if something actually changed;
        # if nothing did (no notification pending anyway), no need to wait.
        run: |
          if [ -f pending_notification.json ]; then
            echo "Deal set changed - giving GitHub Pages time to redeploy before notifying..."
            sleep 90
          else
            echo "Nothing changed, skipping the wait."
          fi

      - name: Send notification (only after the page has had time to update)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          PAGES_URL: ${{ secrets.PAGES_URL }}
        run: python fighting_deals.py --send-pending
