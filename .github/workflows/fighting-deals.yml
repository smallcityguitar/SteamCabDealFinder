name: Fighting game deal check

on:
  schedule:
    # Every 6 hours. Cron is UTC. Adjust as you like.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit state.json back

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run deal check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}     # optional, defaults to https://ntfy.sh
          MIN_DISCOUNT: ${{ secrets.MIN_DISCOUNT }}   # optional, defaults to 60
          PAGES_URL: ${{ secrets.PAGES_URL }}         # optional, auto-detected from repo if unset
        run: python fighting_deals.py

      - name: Save updated state and results page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- state.json docs/
          if ! git diff --cached --quiet; then
            git commit -m "Update deal state and results page"
            git push
          fi
